services:
  # Backend API (FastAPI)
  - type: web
    name: diabetes-api
    runtime: docker
    rootDir: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*"

  # Frontend static site (React + Vite)
  - type: web
    name: diabetes-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: diabetes-api
          property: host
